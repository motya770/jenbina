name: Playwright E2E Tests

on:
  workflow_dispatch: # manual trigger only (E2E requires live LLM)

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-e2e-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-e2e-
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-playwright playwright

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Run Playwright E2E tests with coverage
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        JENBINA_SKIP_AUTH: "1"
      run: |
        python -m pytest tests/e2e/ -v --tb=short --timeout=300 \
          --cov=core \
          --cov-report=term-missing \
          --cov-report=xml:coverage-e2e.xml \
          --cov-fail-under=0

    - name: Show coverage summary
      if: always()
      run: |
        python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

    - name: Upload test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 7
